<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="900" height="520" fill="#ffffff"/>
  <text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold">Smart Door Lock - Circuit Diagram (Arduino Uno)</text>

  <rect x="340" y="60" width="220" height="400" rx="10" fill="#00979d" stroke="#005f63" stroke-width="2"/>
  <text x="450" y="88" text-anchor="middle" fill="#fff" font-size="16" font-weight="bold">ARDUINO UNO</text>
  <g fill="#fff" font-size="12">
    <text x="352" y="130">D2 (Row 1)</text>
    <text x="352" y="155">D3 (Row 2)</text>
    <text x="352" y="180">D4 (Row 3)</text>
    <text x="352" y="205">D5 (Row 4)</text>
    <text x="352" y="230">D6 (Col 1)</text>
    <text x="352" y="255">D7 (Col 2)</text>
    <text x="352" y="280">D8 (Col 3)</text>
    <text x="352" y="305">D9 (Col 4)</text>
    <text x="548" y="130" text-anchor="end">D10 (Servo)</text>
    <text x="548" y="155" text-anchor="end">D11 (Buzzer)</text>
    <text x="548" y="350" text-anchor="end">A4 (SDA)</text>
    <text x="548" y="375" text-anchor="end">A5 (SCL)</text>
    <text x="548" y="410" text-anchor="end">5V</text>
    <text x="548" y="435" text-anchor="end">GND</text>
  </g>

  <rect x="30" y="100" width="190" height="230" rx="8" fill="#eef2ff" stroke="#3b4cca" stroke-width="2"/>
  <text x="125" y="125" text-anchor="middle" font-weight="bold">4x4 MATRIX KEYPAD</text>
  <g font-size="12">
    <text x="45" y="155">Pin 1 (Row 1) &#8594; D2</text>
    <text x="45" y="180">Pin 2 (Row 2) &#8594; D3</text>
    <text x="45" y="205">Pin 3 (Row 3) &#8594; D4</text>
    <text x="45" y="230">Pin 4 (Row 4) &#8594; D5</text>
    <text x="45" y="255">Pin 5 (Col 1) &#8594; D6</text>
    <text x="45" y="280">Pin 6 (Col 2) &#8594; D7</text>
    <text x="45" y="305">Pin 7 (Col 3) &#8594; D8</text>
    <text x="45" y="322">Pin 8 (Col 4) &#8594; D9</text>
  </g>
  <g stroke="#3b4cca" stroke-width="2" fill="none">
    <path d="M220 130 H340"/><path d="M220 155 H300 V155 H340"/>
    <path d="M220 180 H340"/><path d="M220 205 H340"/>
    <path d="M220 230 H340"/><path d="M220 255 H340"/>
    <path d="M220 280 H340"/><path d="M220 305 H340"/>
  </g>

  <rect x="680" y="90" width="200" height="90" rx="8" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
  <text x="780" y="114" text-anchor="middle" font-weight="bold">SERVO (SG90 / MG90S)</text>
  <text x="695" y="136">Signal (orange) &#8594; D10</text>
  <text x="695" y="153">VCC (red) &#8594; 5V *</text>
  <text x="695" y="170">GND (brown) &#8594; GND</text>
  <path d="M560 130 H680" stroke="#ef6c00" stroke-width="2" fill="none"/>

  <rect x="680" y="200" width="200" height="70" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="780" y="224" text-anchor="middle" font-weight="bold">ACTIVE BUZZER</text>
  <text x="695" y="245">(+) &#8594; D11</text>
  <text x="695" y="262">(-) &#8594; GND</text>
  <path d="M560 155 H620 V240 H680" stroke="#c2185b" stroke-width="2" fill="none"/>

  <rect x="680" y="295" width="200" height="120" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="780" y="319" text-anchor="middle" font-weight="bold">16x2 LCD + I2C (0x27)</text>
  <text x="695" y="342">SDA &#8594; A4</text>
  <text x="695" y="360">SCL &#8594; A5</text>
  <text x="695" y="378">VCC &#8594; 5V</text>
  <text x="695" y="396">GND &#8594; GND</text>
  <g stroke="#2e7d32" stroke-width="2" fill="none">
    <path d="M560 350 H620 V342 H680"/><path d="M560 375 H640 V360 H680"/>
    <path d="M560 410 H650 V378 H680"/><path d="M560 435 H660 V396 H680"/>
  </g>

  <rect x="30" y="360" width="290" height="110" rx="8" fill="#f5f5f5" stroke="#999"/>
  <text x="42" y="382" font-weight="bold">Notes</text>
  <text x="42" y="402" font-size="12">* Servo can brown-out the Uno on USB power.</text>
  <text x="42" y="420" font-size="12">Use an external 5V supply and join its GND</text>
  <text x="42" y="438" font-size="12">with Arduino GND. All GND/5V share a common rail.</text>
  <text x="42" y="456" font-size="12">Keypad pin order depends on the keypad model.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
